<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">The minimal anatomy of an agent harness</title>
  <desc id="desc">A request enters an agent harness. The harness assembles context and sends it to a model. If the model requests a tool, the harness checks permission, executes the tool, adds the result to context, and repeats. If the model returns a final response, the harness sends it to the user. Small marks identify Pi, Hermes, Claude Code, and Codex as harness examples.</desc>
  <defs>
    <linearGradient id="codex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B9BFF"/>
      <stop offset="1" stop-color="#4B56D8"/>
    </linearGradient>
    <clipPath id="hermes-logo" clipPathUnits="userSpaceOnUse">
      <circle cx="34" cy="29" r="18"/>
    </clipPath>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#00E100"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#8B8B91"/>
    </marker>
    <style>
      .bg { fill: #0F0F10; }
      .harness { fill: #151815; stroke: #00E100; stroke-width: 2; }
      .panel { fill: #202023; stroke: #5A5A60; stroke-width: 2; }
      .model { fill: #172117; stroke: #00E100; stroke-width: 2; }
      .chip { fill: #111112; stroke: #4A4A50; stroke-width: 1.5; }
      .icon-box { fill: #151517; stroke: #63636A; stroke-width: 1.5; }
      .eyebrow { fill: #00E100; font: 700 17px Menlo, SFMono-Regular, monospace; letter-spacing: 1.5px; }
      .label { fill: #F5F5F5; font: 600 24px "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .label-small { fill: #F5F5F5; font: 600 18px "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .body { fill: #B2B2B7; font: 400 18px "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .meta { fill: #8B8B91; font: 400 16px "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { fill: #D9D9DD; font: 500 16px Menlo, SFMono-Regular, monospace; }
      .green-line { fill: none; stroke: #00E100; stroke-width: 3; marker-end: url(#arrow-green); }
      .return-line { fill: none; stroke: #00E100; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow-green); }
      .response-line { fill: none; stroke: #8B8B91; stroke-width: 2; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="960"/>

  <!-- User -->
  <text x="38" y="390" class="meta" style="letter-spacing:1.4px">USER</text>
  <path d="M57 414H228Q248 414 248 434V506Q248 526 228 526H116L91 552V526H57Q37 526 37 506V434Q37 414 57 414Z" class="panel"/>
  <text x="72" y="460" class="label-small">Request</text>
  <text x="72" y="491" class="meta">message + files</text>

  <!-- Harness boundary -->
  <rect x="292" y="84" width="1268" height="792" rx="28" class="harness"/>
  <text x="332" y="140" class="eyebrow">AGENT HARNESS</text>
  <rect x="1360" y="112" width="162" height="38" rx="19" class="chip"/>
  <text x="1441" y="137" class="mono" text-anchor="middle">device or VM</text>

  <!-- Harness examples -->
  <g transform="translate(332 176)">
    <rect width="132" height="58" rx="12" class="chip"/>
    <circle cx="30" cy="29" r="18" fill="#29292D"/>
    <text x="30" y="36" fill="#F5F5F5" font-family="Georgia, serif" font-size="24" text-anchor="middle">π</text>
    <text x="57" y="35" class="label-small">Pi</text>
  </g>

  <g transform="translate(478 176)">
    <rect width="154" height="58" rx="12" class="chip"/>
    <image href="data:image/jpeg;base64," x="16" y="11" width="36" height="36" preserveAspectRatio="xMidYMid slice" clip-path="url(#hermes-logo)"/>
    <text x="67" y="35" class="label-small">Hermes</text>
  </g>

  <g transform="translate(646 176)">
    <rect width="206" height="58" rx="12" class="chip"/>
    <g transform="translate(30 29)" stroke="#D97757" stroke-width="3" stroke-linecap="round">
      <path d="M0-16V16M-16 0H16M-11-11 11 11M11-11-11 11M-6-15 6 15M6-15-6 15M-15-6 15 6M-15 6 15-6"/>
    </g>
    <text x="60" y="35" class="label-small">Claude Code</text>
  </g>

  <g transform="translate(866 176)">
    <rect width="166" height="58" rx="12" class="chip"/>
    <path d="M17 37C11 37 8 33 8 28C8 23 12 19 17 19C19 13 24 10 31 10C39 10 45 15 46 22C51 22 55 26 55 31C55 35 52 39 47 39H18Z" fill="url(#codex)"/>
    <path d="M23 24 29 29 23 34M33 34H41" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="35" class="label-small">Codex</text>
  </g>

  <!-- Request becomes context -->
  <path d="M248 470H368" class="green-line"/>

  <!-- Context -->
  <rect x="368" y="330" width="310" height="302" rx="18" class="panel"/>
  <g transform="translate(398 364)">
    <rect x="8" y="0" width="32" height="40" rx="3" fill="none" stroke="#8B8B91" stroke-width="2"/>
    <rect x="0" y="8" width="32" height="40" rx="3" fill="#202023" stroke="#F5F5F5" stroke-width="2"/>
    <path d="M8 21H24M8 28H24M8 35H19" stroke="#00E100" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="460" y="393" class="eyebrow">CONTEXT</text>
  <path d="M398 428H648" stroke="#4F4F55"/>
  <text x="398" y="470" class="body">Request + history</text>
  <text x="398" y="511" class="body">Instructions / skills</text>
  <text x="398" y="552" class="body">Tool definitions</text>
  <text x="398" y="602" class="meta">what the model sees</text>

  <path d="M678 481H772" class="green-line"/>
  <rect x="691" y="455" width="68" height="34" rx="17" class="chip"/>
  <text x="725" y="477" class="mono" text-anchor="middle">send</text>

  <!-- Model -->
  <rect x="772" y="330" width="284" height="302" rx="18" class="model"/>
  <g transform="translate(802 365)" fill="none" stroke="#00E100" stroke-width="2">
    <circle cx="23" cy="23" r="21"/>
    <circle cx="15" cy="17" r="3" fill="#00E100"/>
    <circle cx="31" cy="17" r="3" fill="#00E100"/>
    <circle cx="23" cy="32" r="3" fill="#00E100"/>
    <path d="M17 19 21 29M29 19 25 29"/>
  </g>
  <text x="864" y="393" class="eyebrow">MODEL</text>
  <rect x="884" y="404" width="144" height="32" rx="16" class="chip"/>
  <text x="956" y="425" class="mono" text-anchor="middle" style="font-size:14px">local or API</text>
  <path d="M802 454H1026" stroke="#267B2A"/>
  <text x="802" y="498" class="body">Tool call</text>
  <text x="802" y="535" class="meta">or</text>
  <text x="802" y="576" class="body">Final response</text>
  <text x="802" y="608" class="meta">chooses the next step</text>

  <path d="M1056 442H1152" class="green-line"/>
  <rect x="1061" y="406" width="90" height="34" rx="17" class="chip"/>
  <text x="1106" y="428" class="mono" text-anchor="middle">tool call</text>

  <!-- Tool runner -->
  <rect x="1152" y="330" width="330" height="302" rx="18" class="panel"/>
  <g transform="translate(1182 365)">
    <rect x="0" y="0" width="48" height="42" rx="5" fill="none" stroke="#F5F5F5" stroke-width="2"/>
    <path d="M9 13 16 20 9 27M23 28H37" fill="none" stroke="#00E100" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1250" y="393" class="eyebrow">TOOL RUNNER</text>
  <path d="M1182 428H1452" stroke="#4F4F55"/>
  <text x="1182" y="470" class="body">Check permission</text>
  <text x="1182" y="511" class="body">Execute tool</text>
  <text x="1182" y="552" class="body">Capture result</text>
  <text x="1182" y="602" class="meta">files · shell · APIs · browser</text>

  <!-- Tool result closes the loop -->
  <path d="M1317 632V714H523V632" class="return-line"/>
  <rect x="822" y="696" width="184" height="36" rx="18" class="chip"/>
  <text x="914" y="719" class="mono" text-anchor="middle">result → context</text>

  <!-- No tool call ends the turn -->
  <path d="M914 632V792H157V552" class="response-line"/>
  <rect x="530" y="774" width="154" height="36" rx="18" class="chip"/>
  <text x="607" y="797" class="mono" text-anchor="middle">final response</text>
</svg>
