[centaur_context]
version = "0.3.0"
api_version = "v2"
ontology_version = "v4"
database_schema_version = 38
tool_version = "1.2.0"

[runtime]
postgres_major = 16
buildable_container_architectures = ["linux/amd64", "linux/arm64"]
verified_container_architecture = "linux/arm64"
deployment_profile = "single-organization-local-or-private-network"

[centaur]
integration = "pinned overlay tool source plus authenticated Slack post-response ingestion"
compatibility = "contract-based"
notes = "The full Slack loop requires interaction-sink and context-builder hooks carried in the maintainer's Centaur fork. Optional subscription Curator transport also requires a compatible fork-only inference route; no fresh paired-release certification is claimed. No upstream Centaur semantic-version range is claimed. See docs/centaur-integration.md."

[policy]
public_ingress = false
interactive_agent_writes = true
interactive_agent_write_scope = "universal_context_apply_for_ordinary_objects"
automatic_external_model_access = false
