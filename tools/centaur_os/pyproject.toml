[project]
name = "centaur-os"
description = "Read shared Centaur OS context through a constrained agent API"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1",
    "typer>=0.12.0,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
centaur-os = "centaur_tool_centaur_os.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_centaur_os"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "CENTAUR_OS_API_TOKEN", match_headers = ["Authorization"], hosts = ["centaur-os.centaur.svc.cluster.local"]},
]
