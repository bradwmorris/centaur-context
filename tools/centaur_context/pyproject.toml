[project]
name = "centaur-context"
description = "Read shared context from Centaur Context through a constrained agent API"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1",
    "typer>=0.12.0,<1",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10"]

[project.scripts]
centaur-context = "centaur_tool_centaur_context.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_centaur_context"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "CENTAUR_CONTEXT_API_TOKEN", match_headers = ["Authorization"], hosts = ["centaur-context.centaur.svc.cluster.local"]},
    {type = "http", name = "CENTAUR_OS_API_TOKEN", match_headers = ["Authorization"], hosts = ["centaur-os.centaur.svc.cluster.local"]},
]
