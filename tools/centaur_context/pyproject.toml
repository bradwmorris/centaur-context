[project]
name = "centaur-context"
description = "Use the constrained Centaur Context agent API"
version = "1.1.0"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://github.com/bradwmorris/centaur-context"
Repository = "https://github.com/bradwmorris/centaur-context"
Documentation = "https://github.com/bradwmorris/centaur-context/tree/main/docs"

[project.optional-dependencies]
test = ["httpx>=0.27.0,<1", "pytest>=9.0.3,<10"]

[project.scripts]
context_search = "centaur_tool_centaur_context.search:main"
context_read = "centaur_tool_centaur_context.read:main"
context_apply = "centaur_tool_centaur_context.apply:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_centaur_context"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "CENTAUR_CONTEXT_API_TOKEN", mode = "inject", inject_header = "Authorization", inject_formatter = "Bearer {{ .Value }}", hosts = ["centaur-context.centaur.svc.cluster.local"]},
    {type = "http", name = "CENTAUR_OS_API_TOKEN", mode = "inject", inject_header = "Authorization", inject_formatter = "Bearer {{ .Value }}", hosts = ["centaur-os.centaur.svc.cluster.local"]},
    {type = "http", name = "CENTAUR_CONTEXT_NOTE_WRITE_TOKEN", mode = "inject", inject_header = "Authorization", inject_formatter = "Bearer {{ .Value }}", hosts = ["centaur-context-note-write.centaur.svc.cluster.local"]},
    {type = "http", name = "CENTAUR_CONTEXT_INTAKE_TOKEN", mode = "inject", inject_header = "Authorization", inject_formatter = "Bearer {{ .Value }}", hosts = ["centaur-context-intake.centaur.svc.cluster.local"]},
    {type = "http", name = "CENTAUR_CONTEXT_SOURCE_INTAKE_TOKEN", mode = "inject", inject_header = "Authorization", inject_formatter = "Bearer {{ .Value }}", hosts = ["centaur-context-source-intake.centaur.svc.cluster.local"]},
    {type = "http", name = "CENTAUR_CONTEXT_RESEARCH_MUTATION_TOKEN", mode = "inject", inject_header = "Authorization", inject_formatter = "Bearer {{ .Value }}", hosts = ["centaur-context-research-mutation.centaur.svc.cluster.local"]},
    {type = "http", name = "CENTAUR_CONTEXT_EXTERNAL_ACTION_TOKEN", mode = "inject", inject_header = "Authorization", inject_formatter = "Bearer {{ .Value }}", hosts = ["centaur-context-external-action.centaur.svc.cluster.local"]},
]
