apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: centaur-os-provider-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: centaur-os
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            # Replace this documentation-only range with the exact provider
            # network approved by the operator. Do not apply this example as-is.
            cidr: 192.0.2.0/24
      ports:
        - protocol: TCP
          port: 443
