apiVersion: v1
kind: Secret
metadata:
  name: centaur-context-env
type: Opaque
stringData:
  DATABASE_URL: postgres://centaur_context_app:replace-me@postgres.example:5432/centaur_context
  AGENT_API_TOKEN: replace-with-at-least-32-random-characters
  NOTE_WRITE_API_TOKEN: replace-with-a-different-note-write-secret
  CHAT_INGEST_API_TOKEN: replace-with-a-different-32-character-secret
  CURATOR_API_TOKEN: replace-with-a-third-distinct-32-character-secret
  APPROVED_SLACK_SURFACES: T_EXAMPLE:C_EXAMPLE
  # Optional. Add all four together only after approving an embedding provider.
  EMBEDDING_API_URL: https://api.openai.com/v1/embeddings
  EMBEDDING_API_TOKEN: replace-with-a-purpose-bound-provider-key
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_DIMENSIONS: "1536"
  # Optional workflow listeners. Add each token and principal setting together.
  # SOURCE_INTAKE_API_TOKEN: replace-with-a-distinct-32-character-secret
  # SOURCE_INTAKE_ALLOWED_PRINCIPAL: workflow-source-ingestion
  # RESEARCH_MUTATION_API_TOKEN: replace-with-a-distinct-32-character-secret
  # RESEARCH_MUTATION_ALLOWED_PRINCIPAL: workflow-context-mutation
  # EXTERNAL_ACTION_API_TOKEN: replace-with-a-distinct-32-character-secret
  # EXTERNAL_ACTION_ALLOWED_PRINCIPALS: workflow-approved-action
