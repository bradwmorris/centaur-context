apiVersion: v1
kind: Secret
metadata:
  name: centaur-os-env
type: Opaque
stringData:
  DATABASE_URL: postgres://centaur_os_app:replace-me@postgres.example:5432/centaur_os
  AGENT_API_TOKEN: replace-with-at-least-32-random-characters
  CHAT_INGEST_API_TOKEN: replace-with-a-different-32-character-secret
  CURATOR_API_TOKEN: replace-with-a-third-distinct-32-character-secret
  APPROVED_SLACK_SURFACES: T_EXAMPLE:C_EXAMPLE
