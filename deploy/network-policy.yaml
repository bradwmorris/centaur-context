apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: centaur-context
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: centaur-context
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              centaur.ai/iron-proxy: "true"
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8084
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: centaur
              app.kubernetes.io/instance: centaur
              app.kubernetes.io/component: slackbotv2
      ports:
        - protocol: TCP
          port: 8082
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: centaur
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: centaur
              app.kubernetes.io/component: api-rs
      ports:
        - protocol: TCP
          port: 8080
