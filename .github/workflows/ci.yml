name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: context-test-only
          POSTGRES_DB: centaur_context_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d centaur_context_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/centaur_context/pyproject.toml

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Start disposable Kubernetes API
        uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced # v1.9.0
        with:
          cluster_name: context-package-check

      - name: Check package contract
        run: ./scripts/check-package.py

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        env:
          TEST_DATABASE_URL: postgres://postgres:context-test-only@127.0.0.1:5432/centaur_context_test_ci
        run: cargo test -- --test-threads=1

      - name: Install and audit web dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Check and test web application
        working-directory: web
        run: |
          npm run type-check
          npm test -- --run
          npm run build

      - name: Install and test agent client
        run: |
          python -m pip install --disable-pip-version-check 'tools/centaur_context[test]'
          python -m pytest tools/centaur_context/test_client.py scripts/test_rename_contract.py
          python -m compileall -q tools/centaur_context
